<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora AI — ИИ-решения для бизнеса</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #090b13; --text: #ffffff; --accent: #3ee4df; --card: #151925; }
        body { margin: 0; font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #000; font-weight: bold; }
        .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px; }
        h1 { font-size: 48px; max-width: 800px; margin-bottom: 20px; line-height: 1.2; }
        .highlight { color: var(--accent); }
        p { font-size: 18px; color: #a0a5b5; max-width: 600px; margin-bottom: 40px; }
        .btn-main { background: var(--accent); color: #000; padding: 15px 30px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(62,228,223,0.3); }
        
        /* Чат */
        .chat-widget { position: fixed; bottom: 30px; right: 30px; width: 380px; height: 600px; background: var(--card); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .chat-header { background: #1a1f2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .chat-title { display: flex; align-items: center; gap: 10px; font-weight: 700; }
        .chat-status { width: 10px; height: 10px; background: #3fb950; border-radius: 50%; }
        .close-chat { background: none; border: none; color: #a0a5b5; font-size: 24px; cursor: pointer; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .msg.bot { background: #23293a; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.user { background: var(--accent); color: #000; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input-area { padding: 15px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 10px; }
        .chat-input { flex: 1; background: #090b13; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; color: white; outline: none; font-family: inherit; }
        .chat-input:focus { border-color: var(--accent); }
        .send-btn { background: var(--accent); color: #000; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; font-weight: 700; }
        
        /* Админка */
        .admin-panel { display: none; flex-direction: column; height: 100%; background: var(--card); }
        .admin-header { padding: 15px; background: #d29922; color: #000; font-weight: bold; text-align: center; }
        .conv-list { flex: 1; overflow-y: auto; }
        .conv-item { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-size: 14px; }
        .conv-item:hover { background: #23293a; }
        .admin-input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <header>
        <div class="logo"><div class="logo-icon">N</div> NEXORA AI</div>
    </header>
    
    <main class="hero">
        <h1>ИИ, который решает <span class="highlight">реальные задачи</span></h1>
        <p>Создаём ИИ-агентов для компаний: от умных помощников до автоматизации процессов.</p>
        <button class="btn-main" onclick="toggleChat()">Спросить Олега</button>
    </main>

    <!-- Окно чата -->
    <div class="chat-widget" id="chatWidget">
        <div class="chat-header">
            <div class="chat-title">
                <div class="chat-status"></div>
                Олег — ИИ-консультант
            </div>
            <button class="close-chat" onclick="toggleChat()">×</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="msg bot">Здравствуйте! Я Олег, ИИ-консультант Nexora AI. Чем могу помочь?</div>
        </div>
        
        <div class="chat-input-area" id="chatInputArea">
            <input type="text" class="chat-input" id="chatInput" placeholder="Напишите сообщение..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">→</button>
        </div>

        <!-- Скрытая админка -->
        <div class="admin-panel" id="adminPanel">
            <div class="admin-header">Режим Администратора</div>
            <div class="conv-list" id="adminConvList"></div>
            <div class="admin-input-area" id="adminInputArea" style="display:none;">
                <input type="text" class="chat-input" id="adminInput" placeholder="Ответ клиенту...">
                <button class="send-btn" onclick="sendAdminMessage()">→</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = localStorage.getItem('nexora_session');
        if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('nexora_session', sessionId);
        }
        
        let isAdminMode = false;
        let currentAdminSession = null;

        function toggleChat() {
            const widget = document.getElementById('chatWidget');
            widget.style.display = widget.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            // Проверка на команду /admin
            if (text === '/admin') {
                const pass = prompt('Введите секретный код:');
                if (pass === 'SANEKVLADPUTUSPEH') {
                    enterAdminMode();
                } else {
                    addMessage('bot', 'Доступ запрещен.');
                }
                return;
            }

            addMessage('user', text);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, text })
                });
                const data = await res.json();
                
                if (data.aiDisabled) {
                    addMessage('bot', 'Администратор сейчас на связи, ИИ отключен.');
                } else if (data.reply) {
                    addMessage('bot', data.reply);
                } else if (data.error) {
                    addMessage('bot', 'Ошибка: ' + data.error);
                }
            } catch (err) {
                addMessage('bot', 'Ошибка соединения с сервером.');
            }
        }

        function addMessage(role, text) {
            const box = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // --- Логика Админки ---
        function enterAdminMode() {
            isAdminMode = true;
            document.getElementById('chatMessages').style.display = 'none';
            document.getElementById('chatInputArea').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'flex';
            loadConversations();
        }

        async function loadConversations() {
            const res = await fetch('/api/admin?action=conversations');
            if (!res.ok) return;
            const data = await res.json();
            const list = document.getElementById('adminConvList');
            list.innerHTML = '';
            data.forEach(c => {
                const div = document.createElement('div');
                div.className = 'conv-item';
                div.innerText = 'ID: ' + c.sessionId + ' | ' + (c.lastMessagePreview || 'Нет сообщений');
                div.onclick = () => selectConversation(c.sessionId);
                list.appendChild(div);
            });
        }

        async function selectConversation(id) {
            currentAdminSession = id;
            const res = await fetch('/api/admin?action=messages&sessionId=' + id);
            if (!res.ok) return;
            const data = await res.json();
            const box = document.getElementById('chatMessages');
            box.style.display = 'flex';
            box.innerHTML = '';
            data.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
                div.innerText = m.text;
                box.appendChild(div);
            });
            document.getElementById('adminInputArea').style.display = 'flex';
            box.scrollTop = box.scrollHeight;
        }

        async function sendAdminMessage() {
            const input = document.getElementById('adminInput');
            const text = input.value.trim();
            if (!text || !currentAdminSession) return;
            input.value = '';
            
            await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'send', sessionId: currentAdminSession, text })
            });
            selectConversation(currentAdminSession);
        }
    </script>
</body>
</html>
